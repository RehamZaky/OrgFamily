org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Android Gradle Plugin requires Java 17+; this machine's JAVA_HOME/PATH
# default to JDK 11 (Eclipse Adoptium), so point Gradle at JDK 17
# specifically rather than changing the system-wide JAVA_HOME.
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
android.useAndroidX=true
# Kotlin's incremental compiler cache can't relativize paths across drive
# letters (project on D:, pub cache on C:), which crashes the build with
# "this and base files have different roots". Disabling incremental
# compilation avoids it at the cost of slightly slower rebuilds.
kotlin.incremental=false
